# Conda environment for DiG².
#   conda env create -f environment.yml && conda activate dig2 && bash scripts/install.sh
# graph-tool (SBM accuracy, eval) and rdkit come from conda-forge. Everything else is pip.
# Pinned to the versions the paper results were produced with.
name: dig2
channels:
  - conda-forge
dependencies:
  - python=3.10
  - graph-tool=2.97
  - rdkit=2025.03.3
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.7.1
      - torch-geometric==2.6.1
      - pytorch-lightning==2.5.2
      - torchmetrics==1.7.3
      - hydra-core==1.3.2
      - omegaconf==2.3.0
      - numpy==1.26.4
      - scipy==1.13.0
      - pandas==2.3.3
      - networkx==3.4.2
      - pot==0.9.5
      - pygsp==0.5.1
      - fcd-torch==1.0.7
      - matplotlib==3.10.6
      - imageio==2.37.0
      - tqdm==4.67.1
      - pytest
      # molsets (MOSES metrics) is installed by scripts/install.sh with --no-deps: its pinned
      # dependencies would downgrade torch/pandas.
